name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v5.3.0
        with:
          go-version: "1.24"

      - name: Run Go tests
        run: go test -v ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build uchi
        run: go build -o uchi ./cmd/uchi

      - name: Validate representative fixture
        run: ./uchi check -i internal/app/testdata/minimal/input
